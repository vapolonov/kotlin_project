plugins {
  id 'org.jetbrains.kotlin.jvm' version '2.3.0'
  id 'io.qameta.allure' version '3.0.0'
}

group = 'java.example'
version = '1.0-SNAPSHOT'

repositories {
  mavenCentral()
}

kotlin {
  jvmToolchain(21)
}

configurations {
  agent {
    canBeResolved = true
    canBeConsumed = true
  }
}

test {
  useJUnitPlatform {
    if (System.getProperty("TAGS")) {
      includeTags System.getProperty("TAGS")
    }
  }

  systemProperties(System.getProperties())
}

dependencies {
  // Junit
  implementation "org.junit.jupiter:junit-jupiter:6.0.3"
  implementation "org.junit.jupiter:junit-jupiter-engine:6.0.3"
  implementation "org.junit.platform:junit-platform-launcher:6.0.3"
  // Frontend
  implementation "com.codeborne:selenide:7.14.0"
  implementation "io.kotest:kotest-assertions-core:6.1.1"
  implementation "net.datafaker:datafaker:2.5.3"
  // Allure
  agent "org.aspectj:aspectjweaver:1.9.22"
  implementation "io.qameta.allure:allure-junit5:2.33.0"
  implementation 'io.qameta.allure:allure-okhttp3:2.33.0'
  // Jackson
  implementation "tools.jackson.core:jackson-databind:3.1.0"
  implementation "tools.jackson.module:jackson-module-kotlin:3.1.0"
  implementation "com.typesafe:config:1.4.2"
  // Backend
  implementation "com.squareup.okhttp3:okhttp:5.3.2"
  implementation "com.squareup.retrofit2:retrofit:3.0.0"
  implementation "com.google.code.gson:gson:2.13.2"
  implementation "com.squareup.retrofit2:converter-gson:3.0.0"
}